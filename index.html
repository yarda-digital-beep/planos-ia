<style>
:root{
  --coral:#EF907C; --coral-deep:#B3412B; --areia:#DECAA4; --noite:#221D35; --offwhite:#F8F6F2; --lavanda:#686EA0;
  --bg:var(--offwhite); --fg:var(--noite); --muted:#6b6579; --card:#fff; --soft:#F3E9DA; --line:rgba(34,29,53,.12);
  --accent:var(--coral); --accent-ink:var(--coral-deep); --on-accent:var(--noite);
  --font-title:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; --font-text:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1629; --fg:var(--areia); --muted:#b5a98f; --card:#251f3a; --soft:#2d2645; --line:rgba(222,202,164,.16); --accent-ink:var(--coral);
}}
:root[data-theme="dark"]{--bg:#1a1629; --fg:var(--areia); --muted:#b5a98f; --card:#251f3a; --soft:#2d2645; --line:rgba(222,202,164,.16); --accent-ink:var(--coral);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-title);line-height:1.15;margin:0 0 .5em}
a{color:var(--accent-ink)}
code{font-size:.85em;background:var(--soft);padding:.1em .4em;border-radius:6px;word-break:break-word}
button{font:inherit;cursor:pointer}
.btn{background:var(--coral);color:var(--noite);border:0;border-radius:999px;padding:.8em 1.6em;font-weight:600;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.sm{padding:.45em 1em;font-size:.85rem}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:.5em 1.1em;font-weight:500}
.ghost.sm{font-size:.8rem;padding:.35em .9em}
.muted{color:var(--muted);font-size:.9rem}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 15% 20%,rgba(239,144,124,.35),transparent 45%),
  radial-gradient(circle at 85% 80%,rgba(222,202,164,.55),transparent 50%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:40px 32px;box-shadow:0 20px 60px rgba(34,29,53,.12);text-align:center}
.login-card .logo{width:64px;height:64px;margin:0 auto 16px}
.login-card .logo svg{width:100%;height:100%}
.login-card h1{font-size:1.8rem}
.login-card p{color:var(--muted);margin:0 0 24px;font-size:.9rem}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:.8em 1em;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
.field input:focus{outline:2px solid var(--coral);border-color:transparent}
.login-card .btn{width:100%;margin-top:8px}
.err{color:var(--accent-ink);font-size:.85rem;min-height:1.4em;margin-top:10px}
.remember{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);text-align:left}

/* app */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--font-title);font-weight:700;font-size:1.1rem}
.brand b{color:var(--accent-ink)}
.brand-mark{width:28px;height:28px;display:inline-block}
.brand-mark svg{width:100%;height:100%}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;margin-left:auto;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--fg);padding:.5em 1.1em;border-radius:999px;font-weight:600;font-size:.85rem;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--coral);color:var(--noite)}
main{max-width:1100px;margin:0 auto;padding:0 16px 64px}
.hero{padding:48px 0 24px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:600;color:var(--accent-ink);margin:0 0 12px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;max-width:16ch}
.lead{font-size:1.08rem;max-width:62ch;color:var(--fg);opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:28px 0 20px}
.stat{background:var(--areia);color:var(--noite);border-radius:var(--r);padding:18px 20px}
.stat:first-child{background:var(--coral)}
.stat-v{display:block;font-family:var(--font-title);font-size:1.7rem;font-weight:800}
.stat-l{font-size:.82rem;font-weight:500}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:18px 22px;font-family:var(--font-title);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--accent-ink);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
summary .n{font-size:.75rem;background:var(--soft);color:var(--accent-ink);border-radius:999px;padding:.25em .7em;font-family:var(--font-text);font-weight:600}
.body{padding:0 22px 22px}
.body h3{font-size:1rem;margin-top:1.4em}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{background:var(--soft);text-align:left;font-weight:600;padding:10px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
ul.checks{list-style:none;padding:0}
ul.checks li{padding-left:28px;position:relative;margin:8px 0}
ul.checks li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:14px;border-radius:50%;background:var(--coral)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.node{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.88rem;text-align:center}
.node small{font-weight:400;color:var(--muted)}
.node.accent{background:var(--coral);color:var(--noite)}
.arrow{color:var(--accent-ink);font-weight:700}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lane{border-left:4px solid var(--coral);background:var(--soft);border-radius:0 12px 12px 0;padding:12px 16px}
.lane:last-child{border-color:var(--areia)}
.lane p{margin:.3em 0 0;font-size:.9rem}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}
.card{background:var(--soft);border-radius:var(--r);padding:18px 20px}
.card h4{font-size:1rem}
.card p,.card ul{font-size:.9rem;margin:0}
.card ul{padding-left:18px}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;padding:10px 0 10px 48px;position:relative;border-bottom:1px dashed var(--line)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--areia);color:var(--noite);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--areia);color:var(--noite);border-radius:999px;padding:.35em .9em;font-size:.82rem;font-weight:500}
.lvl{border-radius:999px;padding:.15em .7em;font-size:.78rem;font-weight:600;white-space:nowrap}
.lvl.hi{background:var(--coral);color:var(--noite)}.lvl.md{background:var(--areia);color:var(--noite)}.lvl.lo{background:var(--soft)}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ph{background:var(--soft);border-radius:12px;padding:14px;border-top:4px solid var(--areia)}
.ph.accent{border-color:var(--coral)}
.ph span{font-size:.72rem;font-weight:600;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.08em}
.ph b{display:block;font-family:var(--font-title);margin:4px 0}
.ph p{margin:0;font-size:.82rem}

/* mock */
.mock{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:16px 0;font-size:.85rem}
.mock-list{background:var(--soft)}
.mock-item{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.mock-item small{grid-column:1/-1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock-item.on{background:var(--card);border-left:3px solid var(--coral)}
.tag{font-size:.7rem;border-radius:999px;padding:.1em .6em;background:var(--areia);color:var(--noite);font-weight:600;align-self:center}
.tag.warn{background:var(--coral)}
.tag.human{background:var(--lavanda);color:#fff}
.mock-chat{padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.mock-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bubble{max-width:85%;padding:8px 12px;border-radius:14px}
.bubble.in{background:var(--soft);align-self:flex-start}
.bubble.out{background:var(--areia);color:var(--noite);align-self:flex-end}
.mock-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:auto}
@media (max-width:600px){.mock{grid-template-columns:1fr}.mock-list .mock-item:not(.on){display:none}}

/* calc */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:16px 0}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.calc-in label{display:block;font-size:.85rem;font-weight:600;margin-bottom:14px}
.calc-in output{float:right;color:var(--accent-ink);font-weight:700}
.calc-in input[type=range]{width:100%;accent-color:var(--coral);margin-top:6px}
.total{background:var(--coral);color:var(--noite);border-radius:var(--r);padding:20px;margin-bottom:14px}
.total span{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.total b{display:block;font-family:var(--font-title);font-size:2.4rem;line-height:1.1;margin:4px 0}
.total small{display:block;font-size:.85rem}
.bar{margin:10px 0;font-size:.82rem}
.bar-top{display:flex;justify-content:space-between;gap:8px}
.bar-track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:4px}
.bar-track i{display:block;height:100%;background:var(--areia);border-radius:999px;transition:width .25s}
.bar.ai .bar-track i{background:var(--coral)}

/* estudos */
h2.sec{font-size:1.6rem;margin:48px 0 8px}
.progress{display:flex;align-items:center;gap:14px;margin-top:20px;max-width:520px}
.progress-bar{flex:1;height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--areia));transition:width .3s}
.progress span{font-weight:600;font-size:.9rem;white-space:nowrap}
.installs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:16px 0}
.inst,.wk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,opacity .15s}
.inst:hover,.wk:hover{border-color:var(--coral)}
.inst input,.wk input{margin-top:4px;width:18px;height:18px;accent-color:var(--coral);flex:none}
.inst p,.wk p{margin:.2em 0 0;font-size:.85rem}
.inst .when{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.inst b{display:block}
.inst:has(input:checked),.wk:has(input:checked){opacity:.6}
.wk:has(input:checked) b{text-decoration:line-through}
.weeks{display:grid;gap:10px;margin-top:16px}
.wn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--areia);color:var(--noite);display:grid;place-items:center;font-family:var(--font-title);font-weight:800}
.wk:has(input:checked) .wn{background:var(--coral)}
.wk .deliv{font-weight:600;color:var(--fg)}
.wk a{font-size:.82rem}
.block-label{font-family:var(--font-title);font-weight:700;color:var(--accent-ink);margin-top:14px;font-size:.95rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:24px}
</style>
</head>

  <form class="login-card" id="form" autocomplete="on">
    <div class="logo" data-logo></div>
    <h1>Planos</h1>
    <p>Conteúdo privado. Entre com seu usuário e senha.</p>
    <div class="field"><label for="u">Usuário</label><input id="u" name="username" autocomplete="username" required></div>

    <label class="remember"><input type="checkbox" id="rem"> Manter conectado nesta aba</label>
    <button class="btn" type="submit" id="go">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

  var P = JSON.parse(document.getElementById('payload').textContent);
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var tob64 = function(u){ var s=''; u.forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); };
  var SK = 'planos-key';
  function ss(fn){ try { return fn(); } catch(e){ return null; } }

  async function deriveRaw(user, pass){
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase() + ':' + pass), 'PBKDF2', false, ['deriveBits']);

  }
  async function decrypt(raw){
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html){
    document.getElementById('login').hidden = true;
    var app = document.getElementById('app'); app.innerHTML = html; app.hidden = false;
    app.querySelectorAll('[data-logo]').forEach(function(el){ el.innerHTML = LOGO; });
    init(app);
  }
  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    var err = document.getElementById('err'), go = document.getElementById('go');
    err.textContent = ''; go.disabled = true; go.textContent = 'Verificando…';
    try {
      var raw = await deriveRaw(document.getElementById('u').value, document.getElementById('p').value);
      var html = await decrypt(raw);
      if (document.getElementById('rem').checked) ss(function(){ sessionStorage.setItem(SK, tob64(raw)); });
      show(html);
    } catch(x){ err.textContent = 'Usuário ou senha incorretos.'; }
    go.disabled = false; go.textContent = 'Entrar';
  });
  (async function(){
    var k = ss(function(){ return sessionStorage.getItem(SK); });
    if (!k) return;
    try { show(await decrypt(b64(k))); } catch(x){ ss(function(){ sessionStorage.removeItem(SK); }); }
  })();

  function init(app){
    // tabs
    var tabs = app.querySelectorAll('[data-tab]');
    function sel(name){
      tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab === name); });
      app.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = p.dataset.panel !== name; });
      ss(function(){ localStorage.setItem('planos-tab', name); });
      window.scrollTo(0,0);
    }
    tabs.forEach(function(t){ t.addEventListener('click', function(){ sel(t.dataset.tab); }); });
    var saved = ss(function(){ return localStorage.getItem('planos-tab'); });
    if (saved && app.querySelector('[data-panel="'+saved+'"]')) sel(saved);
    app.querySelector('[data-logout]').addEventListener('click', function(){ ss(function(){ sessionStorage.removeItem(SK); }); location.reload(); });
    app.querySelectorAll('[data-expand]').forEach(function(b){ b.addEventListener('click', function(){ app.querySelectorAll('[data-panel="'+b.dataset.expand+'"] details').forEach(function(d){ d.open = true; }); }); });
    app.querySelectorAll('[data-collapse]').forEach(function(b){ b.addEventListener('click', function(){ app.querySelectorAll('[data-panel="'+b.dataset.collapse+'"] details').forEach(function(d){ d.open = false; }); }); });

    // checklists
    var boxes = app.querySelectorAll('input[data-k]');
    var state = ss(function(){ return JSON.parse(localStorage.getItem('planos-check') || '{}'); }) || {};
    function prog(){
      var w = app.querySelectorAll('input[data-k^="w"]'), d = 0;
      w.forEach(function(x){ if (x.checked) d++; });
      var pct = Math.round(d / w.length * 100);
      app.querySelector('[data-prog]').style.width = pct + '%';
      app.querySelector('[data-prog-label]').textContent = d + ' de ' + w.length + ' semanas · ' + pct + '%';
    }
    boxes.forEach(function(b){
      b.checked = !!state[b.dataset.k];
      b.addEventListener('change', function(){ state[b.dataset.k] = b.checked; ss(function(){ localStorage.setItem('planos-check', JSON.stringify(state)); }); prog(); });
    });
    prog();

    // mock painel
    var take = app.querySelector('[data-mock-take]'), human = false;
    take.addEventListener('click', function(){
      human = !human;
      var tag = app.querySelector('[data-mock-tag]');
      tag.textContent = human ? 'Humano: você' : 'Bot';
      tag.classList.toggle('human', human);
      take.textContent = human ? 'Devolver ao bot' : 'Assumir atendimento';
      app.querySelector('[data-mock-note]').textContent = human ? 'Bot pausado. Você está respondendo esta conversa.' : 'O bot está respondendo esta conversa.';
    });

    // calculadora
    var I = {}; app.querySelectorAll('[data-i]').forEach(function(i){ I[i.dataset.i] = i; i.addEventListener('input', calc); });
    var usd = function(v){ return 'US$ ' + v.toLocaleString('pt-BR', {maximumFractionDigits:0}); };
    var brl = function(v){ return 'R$ ' + v.toLocaleString('pt-BR', {maximumFractionDigits:0}); };
    function calc(){
      var v = {}; for (var k in I) v[k] = parseFloat(I[k].value);
      var fmt = {leads: v.leads.toLocaleString('pt-BR'), replies: v.replies, book: v.book + '%', ret: v.ret + '%', sonnet: v.sonnet + '%', host: 'US$ ' + v.host, fx: 'R$ ' + v.fx.toFixed(2).replace('.', ',')};
      for (var o in fmt) app.querySelector('[data-o="'+o+'"]').textContent = fmt[o];
      var msgs = v.leads * v.replies, calls = msgs * 1.5, s = v.sonnet / 100;
      var items = [
        {n:'Meta: respostas do bot', v: Math.max(0, msgs - 1000) * 0.0068},
        {n:'Meta: lembretes (utility)', v: v.leads * v.book / 100 * 0.0068},
        {n:'Meta: retomada (marketing)', v: v.leads * v.ret / 100 * 0.0625},
        {n:'IA: Claude Haiku 5.5', v: calls * (1 - s) * 0.0005 + 2, ai:true},
        {n:'IA: Claude Sonnet 5.5', v: calls * s * 0.011, ai:true},
        {n:'Transcrição de áudio', v: v.leads * 0.2 * 2 * 0.006},
        {n:'Hospedagem e domínio', v: v.host + 1}
      ];
      var tot = items.reduce(function(a, i){ return a + i.v; }, 0), max = Math.max.apply(null, items.map(function(i){ return i.v; }));
      app.querySelector('[data-r="totalBRL"]').textContent = brl(tot * v.fx);
      app.querySelector('[data-r="totalUSD"]').textContent = usd(tot) + ' por mês';
      app.querySelector('[data-r="perLead"]').textContent = 'R$ ' + (tot * v.fx / v.leads).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' por lead';
      app.querySelector('[data-bars]').innerHTML = items.map(function(i){
        return '<div class="bar' + (i.ai ? ' ai' : '') + '"><div class="bar-top"><span>' + i.n + '</span><b>' + usd(i.v) + '</b></div><div class="bar-track"><i style="width:' + (max ? i.v / max * 100 : 0) + '%"></i></div></div>';
      }).join('');
    }
    calc();
  }
})();
